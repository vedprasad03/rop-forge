name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build toolchain (for compiling test fixtures)
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync dependencies (including the live extra)
        run: uv sync --extra live

      - name: Run test suite
        run: |
          sudo sysctl -w kernel.core_pattern=core
          ulimit -c unlimited
          uv run pytest -v
