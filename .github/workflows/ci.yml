name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build toolchain (for compiling test fixtures)
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync dependencies (including the live extra)
        run: uv sync --extra live

      - name: "DIAGNOSTIC (temporary, to be removed): strace a single crash"
        run: |
          sudo apt-get install -y -qq strace
          sudo sysctl -w kernel.core_pattern=core
          ulimit -c unlimited
          cat > /tmp/diag.py << 'EOF'
          from pwn import context, cyclic, process
          context.log_level = "error"
          payload = cyclic(512)
          print(f"payload length: {len(payload)}", flush=True)
          io = process("fixtures/build/fixture1_none")
          io.send(payload)
          io.wait()
          print(f"exit status: {io.poll()}", flush=True)
          EOF
          strace -f -tt -e trace=execve,read,write -s 40 -o /tmp/strace.log \
            uv run python3 /tmp/diag.py || true
          echo "=== strace log ==="
          cat /tmp/strace.log

      - name: Run test suite
        run: |
          sudo sysctl -w kernel.core_pattern=core
          ulimit -c unlimited
          uv run pytest -v
